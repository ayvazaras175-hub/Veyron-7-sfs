
name: Import Veyron-7

on:
  workflow_dispatch:

jobs:
  import-system:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: ZIP dosyasını aç
        run: |
          unzip -o Veyron-7-SFS-1.6.zip -d extracted

      - name: Dosyaları depoya aktar
        run: |
          cp -r extracted/Veyron-7/. .
          rm -rf extracted
          rm -f Veyron-7-SFS-1.6.zip

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Veyron-7 solar system" || echo "No changes"
          git push
